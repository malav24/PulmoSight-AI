# Baseline classifier: efficientnet_b0 (classification only, ImageNet-initialised for training).
_base_: base.yaml
experiment:
  name: efficientnet_b0
model:
  name: efficientnet_b0
  pretrained_backbone: true
  head_dropout: 0.2
training:
  lr: 1.0e-4
  backbone_lr: 1.0e-4
checkpoint:
  subdir: baselines
  model_key: efficientnet_b0
