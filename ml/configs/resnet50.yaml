# Baseline classifier: resnet50 (classification only, ImageNet-initialised for training).
_base_: base.yaml
experiment:
  name: resnet50
model:
  name: resnet50
  pretrained_backbone: true
  head_dropout: 0.2
training:
  lr: 1.0e-4
  backbone_lr: 1.0e-4
checkpoint:
  subdir: baselines
  model_key: resnet50
